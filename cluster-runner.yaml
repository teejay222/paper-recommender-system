apiVersion: v1
kind: Pod
metadata:
  name: cluster-runner-pod
  namespace: tahu2574  # <--- ADD THIS LINE
spec:
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  nodeSelector:
    gpu: a100
  containers:
  - name: runner
    image: nvcr.io/nvidia/pytorch:23.10-py3
    command: ["/bin/bash", "-c", "--", "while true; do sleep 30; done;"]
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1
    volumeMounts:
    - name: cluster-disk
      mountPath: /workspace/project
  volumes:
  - name: cluster-disk
    persistentVolumeClaim:
      claimName: recommender-storage-pvc